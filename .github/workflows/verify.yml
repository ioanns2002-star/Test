name: Test and build AgentBridge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - if: runner.os == 'Windows'
        run: python -m pip install -e ".[windows]"
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem windows\*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }

  windows-package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[windows,build]"
      - shell: pwsh
        run: .\windows\Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBridge-windows-x64
          path: |
            dist/AgentBridge-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
